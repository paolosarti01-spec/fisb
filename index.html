<!-- React 18 + Babel standalone: nessun passaggio di build necessario -->

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

// ------------------------------------------------------------
// Storage: stesso identico "contratto" usato dall'artifact originale,
// ma qui appoggiato su localStorage (dati solo su questo dispositivo).
// ------------------------------------------------------------
window.storage = {
  get: async (key) => {
    const v = localStorage.getItem(key);
    return v === null ? null : { key, value: v };
  },
  set: async (key, value) => {
    localStorage.setItem(key, value);
    return { key, value };
  },
};


// ============================================================
// PALETTE
// ============================================================
const C = {
  bg: "#232B38",
  surface: "#2C3444",
  surfaceRaised: "#333D50",
  line: "#404B5F",
  text: "#EDEAE0",
  textMuted: "#9BA3B4",
  gold: "#C9A24B",
  goldDim: "#8A7440",
  teal: "#4E9A94",
  red: "#B5654F",
};

const STORAGE_KEY = "fisb-judge-data-v1";

const SPECIALTIES = [
  { key: "singolo", label: "Singolo" },
  { key: "coppia", label: "Coppia" },
  { key: "piccola", label: "Piccola squadra" },
  { key: "grande", label: "Grande squadra" },
];

// ============================================================
// FIXED SCORING TABLES (from fisb.m — not editable in-app)
// ============================================================
const PARTS = { singolo: 5, coppia: 4, piccola: 3, grande: 2 };

const COMPO_MAX = {
  singolo: { b: [3, 3, 4, 3, 1], c: [1, 2, 4, 4, 3], a: [0, 0, 0, 0], ar: [4, 3, 2, 1, 1], cc: [0, 0] },
  coppia: { b: [2, 1, 3, 1, 0], c: [1, 3, 2, 1, 0], a: [2, 4, 3, 3], ar: [1, 4, 2, 1, 0], cc: [2, 2] },
  piccola: { b: [2, 2, 2, 0, 0], c: [4, 3, 3, 0, 0], a: [3, 4, 2, 0], ar: [4, 5, 3, 0, 0], cc: [3, 3] },
  grande: { b: [4, 2, 0, 0, 0], c: [5, 4, 0, 0, 0], a: [8, 5, 0, 0], ar: [5, 5, 0, 0, 0], cc: [3, 3] },
};
const COMPO_BONUS = {
  singolo: [55, 50, 45, 30, 20],
  coppia: [70, 55, 40, 25, 0],
  piccola: [100, 60, 20, 0, 0],
  grande: [90, 110, 0, 0, 0],
};
const MASSIMALE_COMPO_BASE = { singolo: 275, coppia: 240, piccola: 260, grande: 310 };
const MASSIMALE_DIFF_BASE = { singolo: 2200, coppia: 2800, piccola: 3450, grande: 4000 };

const DIFF_POINTS = {
  singolo: { D: [10, 15, 30, 45, 60], C: [20, 30, 60, 90, 120], B: [30, 45, 90, 135, 180], A: [40, 60, 120, 180, 240], AA: [50, 75, 180, 270, 360] },
  coppia: { D: [10, 15, 30, 45, 60], C: [20, 30, 60, 90, 120], B: [30, 45, 90, 135, 180], A: [40, 60, 120, 180, 240], AA: [50, 75, 180, 270, 360] },
  piccola: { D: [10, 15, 30, 0, 0], C: [20, 30, 60, 0, 0], B: [30, 45, 90, 0, 0], A: [40, 75, 150, 0, 0], AA: [50, 60, 120, 0, 0] },
  grande: { D: [10, 15, 0, 0, 0], C: [20, 30, 0, 0, 0], B: [30, 45, 0, 0, 0], A: [40, 75, 0, 0, 0], AA: [50, 60, 0, 0, 0] },
};
const PIU_WEIGHTS = [5, 7.5, 15, 22.5, 30];
const DIFF_CAPS_STD = { D: [Infinity, Infinity, 5, 4, 3], C: [6, 6, 5, 4, 3], B: [5, 5, 5, 4, 3], A: [4, 4, 5, 4, 3], AA: [4, 4, 5, 4, 3] };
function grandeCaps(atleti) {
  const n = Number(atleti) || 16;
  if (n >= 15) return { C: [6, 6], B: [6, 5], A: [3, 3], AA: [3, 3] };
  if (n >= 13) return { C: [6, 6], B: [6, 5], A: [3, 4], AA: [3, 3] };
  if (n >= 11) return { C: [6, 6], B: [6, 6], A: [4, 4], AA: [3, 3] };
  return { C: [6, 6], B: [6, 6], A: [3, 5], AA: [4, 3] };
}
const DIFF_FACTOR = { singolo: 0.5, coppia: 1, piccola: 2, grande: 4 };
const ALTEZZA_MULT = { singolo: 150, coppia: 200, piccola: 250, grande: 300 };

const ESEC_BASE = { singolo: 9.5, coppia: 9.5, piccola: 7.5, grande: 8.5 };

// ============================================================
// PURE CALCULATION FUNCTIONS
// ============================================================
function emptyCompo() {
  return { b: [0, 0, 0, 0, 0], c: [0, 0, 0, 0, 0], a: [0, 0, 0, 0], ar: [0, 0, 0, 0, 0], cc: [0, 0] };
}
function emptyDiff() {
  return { D: [0, 0, 0, 0, 0], C: [0, 0, 0, 0, 0], B: [0, 0, 0, 0, 0], A: [0, 0, 0, 0, 0], AA: [0, 0, 0, 0, 0], piu: [0, 0, 0, 0, 0], meno: [0, 0, 0, 0, 0] };
}
function emptySpett() {
  return { coreo: 0, ist: 0, sinc: 0, diff: 0, stelle: 0, presCompletamento: false, presSpettacolarita: false };
}
function emptyPenalty() {
  return { lieve: 0, media: 0, alta: 0, grave: 0, speciale: 0, lieveB: 0, mediaB: 0, graveB: 0 };
}
function emptyPortamento() {
  return { stat: 0, din: 0, marz: 0, eleg: 0 };
}

function computePunteggioCompo(specialty, compo, spett) {
  const M = COMPO_MAX[specialty];
  const capB = (i) => Math.min(M.b[i] || 0, compo.b[i] || 0);
  const capC = (i) => Math.min(M.c[i] || 0, compo.c[i] || 0);
  const capA = (i) => Math.min(M.a[i] !== undefined ? M.a[i] : 0, compo.a[i] || 0);
  const capAR = (i) => Math.min(M.ar[i] || 0, compo.ar[i] || 0);
  const capCC = (i) => Math.min(M.cc[i] || 0, compo.cc[i] || 0);

  const parts = [0, 1, 2, 3, 4].map((i) => {
    const bb = capB(i), bc = capC(i), ba = i < 4 ? capA(i) : 0, bar = capAR(i);
    if (i === 0 || i === 1) return bb + bc * 2 + ba * 2 + bar + capCC(i) * 4;
    if (i === 2 || i === 3) return bb + bc * 2 + ba * 2 + bar;
    return bb + bc * 2 + bar;
  });

  const denoms = [0, 1, 2, 3, 4].map((i) => {
    const Mb = M.b[i] || 0, Mc = M.c[i] || 0, Ma = M.a[i] !== undefined ? M.a[i] : 0, Mar = M.ar[i] || 0, Mcc = i < 2 ? M.cc[i] || 0 : 0;
    if (i === 0 || i === 1) return Mb + Mc * 2 + Ma * 2 + Mar + Mcc * 4;
    if (i === 2 || i === 3) return Mb + Mc * 2 + Ma * 2 + Mar;
    return Mb + Mc * 2 + Mar;
  });

  const bonusArr = COMPO_BONUS[specialty];
  const punteggioBonus = [0, 1, 2, 3, 4].reduce((s, i) => (denoms[i] ? s + (parts[i] / denoms[i]) * bonusArr[i] : s), 0);

  const spettCoreo = Math.min(8, spett.coreo || 0);
  const spettIst = Math.min(10, spett.ist || 0);
  const spettSinc = Math.min(7, spett.sinc || 0);
  const spettDiffCap = specialty === "grande" ? 70 : 40;
  let punteggioSpett = spettCoreo * 3 + spettIst * 1.5 + spettSinc * 3 + Math.min(spettDiffCap, (spett.diff || 0) * 4);
  if (specialty !== "grande") punteggioSpett += (spett.stelle || 0) * 16;

  const sumAr = compo.ar.reduce((a, b) => a + (b || 0), 0);
  const sumCc = compo.cc.reduce((a, b) => a + (b || 0), 0);
  const ccCap = specialty === "coppia" ? 4 : 6;
  const common = [0, 1, 2, 3, 4].reduce((s, i) => {
    const bb = capB(i), bc = capC(i), ba = i < 4 ? capA(i) : 0;
    return i < 4 ? s + bb + bc * 2 + ba * 2 : s + bb + bc * 2;
  }, 0);
  const punteggioCompoBase = common + Math.min(10, sumAr) + Math.min(ccCap, sumCc) * 4;

  const punteggioPresentazione = specialty === "grande" ? (spett.presCompletamento ? 7 : 0) + (spett.presSpettacolarita ? 3 : 0) : 0;

  return punteggioCompoBase + punteggioBonus + punteggioSpett + punteggioPresentazione;
}

function computePunteggioDiff(specialty, diff, numeroAtleti, altezzaLanci) {
  const pts = DIFF_POINTS[specialty];
  const parts = PARTS[specialty];
  let caps;
  if (specialty === "grande") {
    const g = grandeCaps(numeroAtleti);
    caps = { D: [Infinity, Infinity], C: g.C, B: g.B, A: g.A, AA: g.AA };
  } else {
    caps = DIFF_CAPS_STD;
  }
  let total = 0;
  for (let i = 0; i < parts; i++) {
    const dCap = caps.D[i] === undefined ? Infinity : caps.D[i];
    total += Math.min(diff.D[i] || 0, dCap) * (pts.D[i] || 0);
    total += Math.min(diff.C[i] || 0, caps.C[i] ?? Infinity) * (pts.C[i] || 0);
    total += Math.min(diff.B[i] || 0, caps.B[i] ?? Infinity) * (pts.B[i] || 0);
    total += Math.min(diff.A[i] || 0, caps.A[i] ?? Infinity) * (pts.A[i] || 0);
    total += Math.min(diff.AA[i] || 0, caps.AA[i] ?? Infinity) * (pts.AA[i] || 0);
    total += (diff.piu[i] || 0) * PIU_WEIGHTS[i] - (diff.meno[i] || 0) * PIU_WEIGHTS[i];
  }
  const totaleDifficoltaLanci = total * DIFF_FACTOR[specialty];
  const pAltezza = ((altezzaLanci || 0) / 10) * ALTEZZA_MULT[specialty];
  return totaleDifficoltaLanci + pAltezza;
}

function computeEsecuzione(specialty, penalty, portamento) {
  const isAB = specialty === "singolo" || specialty === "coppia";
  const pLieve = isAB ? 0.15 : 0.1;
  const pMedia = isAB ? 0.3 : 0.2;
  const pAlta = isAB ? 0.6 : 0.45;
  const totalePenalita =
    penalty.lieve * pLieve + penalty.media * pMedia + penalty.alta * pAlta + penalty.grave * 1 + penalty.speciale * 2.5 +
    penalty.lieveB * 0.4 + penalty.mediaB * 0.9 + penalty.graveB * 1.5;
  let totaleEsecuzione = ESEC_BASE[specialty] - totalePenalita;
  if (totaleEsecuzione < 0) totaleEsecuzione = 0;
  const totalePortamento = (portamento.stat + portamento.din + portamento.marz + portamento.eleg) * 0.125;
  return totaleEsecuzione + totalePortamento;
}

function trentesimiCompo(specialty, punteggioCompo, base, garaMax) {
  const trasl = garaMax - base;
  if (specialty === "singolo") {
    if (punteggioCompo < 60 + trasl) return (punteggioCompo / (60 + trasl)) * 0.5;
    if (punteggioCompo < 125 + trasl) return 0.5 + ((punteggioCompo - (60 + trasl)) / (125 - 60.01)) * 1.5;
    if (punteggioCompo < 195 + trasl) return 2 + ((punteggioCompo - (125 + trasl)) / (195 - 125.01)) * 2.5;
    return 4.5 + ((punteggioCompo - (195 + trasl)) / (base - 195.01)) * 3.5;
  }
  if (specialty === "coppia") {
    if (punteggioCompo < 65 + trasl) return (punteggioCompo / (65 + trasl)) * 1.5;
    if (punteggioCompo < 135 + trasl) return 1.5 + ((punteggioCompo - (65 + trasl)) / (135 - 65.01)) * 2;
    if (punteggioCompo < 205 + trasl) return 3.5 + ((punteggioCompo - (135 + trasl)) / (205 - 135.01)) * 2.5;
    return 6 + ((punteggioCompo - (205 + trasl)) / (base - 205.01)) * 3;
  }
  // piccola & grande
  return garaMax > 0 ? (punteggioCompo / garaMax) * 11 : 0;
}

function trentesimiDiff(specialty, punteggioDiff, base, garaMax) {
  const trasl = garaMax - base;
  if (specialty === "singolo") {
    if (punteggioDiff < 550 + trasl) return (punteggioDiff / (550 + trasl)) * 2;
    if (punteggioDiff < 1100 + trasl) return 2 + ((punteggioDiff - (550 + trasl)) / (1100 - 550.01)) * 2.5;
    if (punteggioDiff < 1700 + trasl) return 4.5 + ((punteggioDiff - (1100 + trasl)) / (1700 - 1100.01)) * 3;
    return 7.5 + ((punteggioDiff - (1700 + trasl)) / (base - 1700.01)) * 3.5;
  }
  if (specialty === "coppia") {
    if (punteggioDiff < 580 + trasl) return (punteggioDiff / (580 + trasl)) * 1;
    if (punteggioDiff < 1330 + trasl) return 1 + ((punteggioDiff - (580 + trasl)) / (1330 - 580.01)) * 2;
    if (punteggioDiff < 2130 + trasl) return 3 + ((punteggioDiff - (1330 + trasl)) / (2130 - 1330.01)) * 3;
    return 6 + ((punteggioDiff - (2130 + trasl)) / (base - 2130.01)) * 3;
  }
  if (specialty === "piccola") return garaMax > 0 ? (punteggioDiff / garaMax) * 10 : 0;
  return garaMax > 0 ? (punteggioDiff / garaMax) * 9 : 0; // grande
}

function groupMassimale(performances, base, key) {
  return performances.reduce((m, p) => (p[key] > m ? p[key] : m), base);
}

function scorePerformance(perf, specialty, massimaleCompoBase, massimaleDiffBase, garaCompoMax, garaDiffMax) {
  const tCompo = trentesimiCompo(specialty, perf.punteggioCompo, massimaleCompoBase, garaCompoMax);
  const tDiff = trentesimiDiff(specialty, perf.punteggioDiff, massimaleDiffBase, garaDiffMax);
  const total = tCompo + tDiff + perf.punteggioEsecuzione;
  return { tCompo, tDiff, total };
}

function fmt(n, d = 2) {
  const r = Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
  return r.toFixed(d).replace(".", ",");
}

// ============================================================
// UI ATOMS
// ============================================================
function Button({ children, onClick, variant = "solid", style, disabled, full }) {
  const base = {
    display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8,
    borderRadius: 10, padding: "12px 18px", fontSize: 15, fontWeight: 600,
    border: "1px solid transparent", cursor: disabled ? "default" : "pointer",
    opacity: disabled ? 0.45 : 1, width: full ? "100%" : undefined,
  };
  const variants = {
    solid: { background: C.gold, color: "#1C2230" },
    outline: { background: "transparent", color: C.text, borderColor: C.line },
    ghost: { background: "transparent", color: C.textMuted },
    danger: { background: "transparent", color: C.red, borderColor: C.red },
  };
  return (
    <button disabled={disabled} onClick={onClick} style={{ ...base, ...variants[variant], ...style }}>
      {children}
    </button>
  );
}

function TopBar({ title, subtitle, onBack, right }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "18px 16px 14px", borderBottom: `1px solid ${C.line}`, position: "sticky", top: 0, background: C.bg, zIndex: 5 }}>
      {onBack && (
        <button onClick={onBack} style={{ background: "none", border: "none", color: C.text, cursor: "pointer", padding: 4 }}>
          <span style={{ fontSize: 22, lineHeight: 1 }}>&#8249;</span>
        </button>
      )}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 18, fontWeight: 700, color: C.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{title}</div>
        {subtitle && <div style={{ fontSize: 12.5, color: C.textMuted, marginTop: 2 }}>{subtitle}</div>}
      </div>
      {right}
    </div>
  );
}

function SectionTitle({ children, accent }) {
  return <div style={{ fontSize: 13, fontWeight: 700, color: accent || C.gold, margin: "18px 0 10px" }}>{children.toUpperCase()}</div>;
}

function PartTabs({ count, active, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
      {Array.from({ length: count }, (_, i) => i).map((i) => (
        <button
          key={i}
          onClick={() => onChange(i)}
          style={{
            flex: 1, padding: "8px 0", borderRadius: 8, border: "none", fontSize: 13, fontWeight: 700, cursor: "pointer",
            background: active === i ? C.gold : C.surface, color: active === i ? "#1C2230" : C.textMuted, fontFamily: "ui-monospace, monospace",
          }}
        >
          {i + 1}
        </button>
      ))}
    </div>
  );
}

function Counter({ label, sub, count, accent, onChange, min = 0 }) {
  return (
    <div style={{ background: C.surface, borderRadius: 10, padding: "8px 10px", display: "flex", alignItems: "center", gap: 8, border: count > min ? `1px solid ${accent}55` : "1px solid transparent" }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 13, color: C.text, fontWeight: 600 }}>{label}</div>
        {sub && <div style={{ fontSize: 10.5, color: C.textMuted }}>{sub}</div>}
      </div>
      <button onClick={() => count > min && onChange(count - 1)} disabled={count <= min} style={{ background: "none", border: "none", color: count <= min ? C.line : C.textMuted, cursor: count <= min ? "default" : "pointer", padding: 4 }}>
        <span style={{ fontSize: 14, lineHeight: 1 }}>&minus;</span>
      </button>
      <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 17, fontWeight: 700, color: count > min ? accent : C.textMuted, minWidth: 20, textAlign: "center" }}>{count}</span>
      <button onClick={() => onChange(count + 1)} style={{ background: "none", border: "none", color: accent, cursor: "pointer", padding: 4 }}>
        <span style={{ fontSize: 14, lineHeight: 1 }}>+</span>
      </button>
    </div>
  );
}

function NumberField({ label, value, onChange, min, max, step = 1 }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.surface, borderRadius: 10, padding: "10px 12px", marginBottom: 8 }}>
      <span style={{ fontSize: 13.5, color: C.text }}>{label}</span>
      <input
        type="number" value={value} min={min} max={max} step={step}
        onChange={(e) => {
          let v = parseFloat(e.target.value);
          if (isNaN(v)) v = min;
          if (min !== undefined) v = Math.max(min, v);
          if (max !== undefined) v = Math.min(max, v);
          onChange(v);
        }}
        style={{ width: 70, background: C.surfaceRaised, border: `1px solid ${C.line}`, borderRadius: 6, color: C.gold, fontWeight: 700, fontFamily: "ui-monospace, monospace", padding: "6px 8px", textAlign: "center" }}
      />
    </div>
  );
}

function Toggle({ label, points, value, onChange }) {
  return (
    <button
      onClick={() => onChange(!value)}
      style={{ width: "100%", textAlign: "left", background: value ? `${C.gold}22` : C.surface, border: value ? `1px solid ${C.gold}` : "1px solid transparent", borderRadius: 10, padding: "10px 12px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}
    >
      <span style={{ fontSize: 13.5, color: C.text }}>{label}</span>
      <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 13, fontWeight: 700, color: value ? C.gold : C.textMuted }}>+{points}</span>
    </button>
  );
}

// ============================================================
// HOME
// ============================================================
function Home({ competitions, onNew, onOpen, onDelete }) {
  return (
    <div>
      <TopBar title="Giudice esibizioni" subtitle={competitions.length ? `${competitions.length} competizioni` : "Nessuna competizione ancora"} />
      <div style={{ padding: 16 }}>
        <Button full onClick={onNew} style={{ marginBottom: 22 }}>
          <span style={{ fontSize: 18, lineHeight: 1 }}>&#128193;</span> Nuova competizione
        </Button>
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {competitions.map((comp) => (
            <div key={comp.id} onClick={() => onOpen(comp)} style={{ background: C.surface, borderRadius: 12, padding: 14, display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }}>
              <span style={{ fontSize: 20 }}>&#128193;</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ color: C.text, fontWeight: 600, fontSize: 15 }}>{comp.name}</div>
                <div style={{ color: C.textMuted, fontSize: 12, marginTop: 2 }}>{Object.keys(comp.specialties).length} specialità</div>
              </div>
              <button onClick={(e) => { e.stopPropagation(); onDelete(comp.id); }} style={{ background: "none", border: "none", color: C.textMuted, cursor: "pointer", padding: 4 }}>
                <span style={{ fontSize: 16, lineHeight: 1 }}>&#128465;</span>
              </button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function NameModal({ title, placeholder, onConfirm, onCancel }) {
  const [name, setName] = useState("");
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, zIndex: 30 }}>
      <div style={{ background: C.surface, borderRadius: 14, padding: 20, width: "100%", maxWidth: 340 }}>
        <div style={{ color: C.text, fontWeight: 700, fontSize: 16, marginBottom: 12 }}>{title}</div>
        <input autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder={placeholder}
          style={{ width: "100%", background: C.surfaceRaised, border: `1px solid ${C.line}`, borderRadius: 8, color: C.text, fontSize: 15, padding: "10px 12px", outline: "none", marginBottom: 16, boxSizing: "border-box" }} />
        <div style={{ display: "flex", gap: 8 }}>
          <Button variant="outline" style={{ flex: 1 }} onClick={onCancel}>Annulla</Button>
          <Button style={{ flex: 1 }} disabled={!name.trim()} onClick={() => onConfirm(name.trim())}>Conferma</Button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// COMPETITION SCREEN
// ============================================================
function CompetitionScreen({ competition, onBack, onOpenSpecialty, onAddSpecialty }) {
  const [picking, setPicking] = useState(false);
  const missing = SPECIALTIES.filter((s) => !competition.specialties[s.key]);

  return (
    <div>
      <TopBar title={competition.name} subtitle="Specialità di questa competizione" onBack={onBack} />
      <div style={{ padding: 16 }}>
        {missing.length > 0 && (
          <Button full variant="outline" onClick={() => setPicking(true)} style={{ marginBottom: 18 }}>
            <span style={{ fontSize: 18, lineHeight: 1 }}>+</span> Aggiungi specialità
          </Button>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {SPECIALTIES.filter((s) => competition.specialties[s.key]).map((s) => {
            const grp = competition.specialties[s.key];
            return (
              <div key={s.key} onClick={() => onOpenSpecialty(s.key)} style={{ background: C.surface, borderRadius: 12, padding: 14, display: "flex", alignItems: "center", gap: 12, cursor: "pointer" }}>
                <span style={{ fontSize: 20 }}>&#128203;</span>
                <div style={{ flex: 1 }}>
                  <div style={{ color: C.text, fontWeight: 600, fontSize: 15 }}>{s.label}</div>
                  <div style={{ color: C.textMuted, fontSize: 12, marginTop: 2 }}>{grp.performances.length} esibizioni valutate</div>
                </div>
              </div>
            );
          })}
        </div>
        {Object.keys(competition.specialties).length === 0 && (
          <div style={{ color: C.textMuted, fontSize: 14, padding: "24px 4px", textAlign: "center" }}>Aggiungi una specialità per iniziare a giudicare.</div>
        )}
      </div>
      {picking && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.55)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 30 }}>
          <div style={{ background: C.surface, borderRadius: "16px 16px 0 0", padding: 20, width: "100%", maxWidth: 480 }}>
            <div style={{ color: C.text, fontWeight: 700, fontSize: 16, marginBottom: 14 }}>Scegli specialità</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
              {missing.map((s) => (
                <Button key={s.key} variant="outline" full onClick={() => { onAddSpecialty(s.key); setPicking(false); }}>{s.label}</Button>
              ))}
            </div>
            <Button variant="ghost" full onClick={() => setPicking(false)}>Annulla</Button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================================
// SPECIALTY SCREEN (folder of performances + ranking)
// ============================================================
function SpecialtyScreen({ specialty, group, onBack, onUpdateMassimale, onNew, onOpenDetail, onDelete }) {
  const meta = SPECIALTIES.find((s) => s.key === specialty);
  const garaCompoMax = groupMassimale(group.performances, group.massimaleCompoBase, "punteggioCompo");
  const garaDiffMax = groupMassimale(group.performances, group.massimaleDiffBase, "punteggioDiff");

  const scored = group.performances
    .map((p) => ({ ...p, ...scorePerformance(p, specialty, group.massimaleCompoBase, group.massimaleDiffBase, garaCompoMax, garaDiffMax) }))
    .sort((a, b) => b.total - a.total);

  return (
    <div style={{ paddingBottom: 90 }}>
      <TopBar title={meta.label} subtitle="Massimali e classifica" onBack={onBack} />
      <div style={{ padding: 16 }}>
        <SectionTitle accent={C.teal}>Massimali di gara</SectionTitle>
        <NumberField label="Massimale composizione (base)" value={group.massimaleCompoBase} min={1} step={1} onChange={(v) => onUpdateMassimale("massimaleCompoBase", v)} />
        <NumberField label="Massimale difficoltà (base)" value={group.massimaleDiffBase} min={1} step={1} onChange={(v) => onUpdateMassimale("massimaleDiffBase", v)} />
        {(garaCompoMax > group.massimaleCompoBase || garaDiffMax > group.massimaleDiffBase) && (
          <div style={{ fontSize: 11.5, color: C.textMuted, marginBottom: 6 }}>
            Massimale di gara attuale — Compo: {fmt(garaCompoMax, 1)} · Diff: {fmt(garaDiffMax, 1)} (sforato da una performance)
          </div>
        )}

        <SectionTitle>Classifica</SectionTitle>
        {scored.length === 0 && <div style={{ color: C.textMuted, fontSize: 14, padding: "16px 0" }}>Nessuna esibizione ancora valutata.</div>}
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {scored.map((p, i) => (
            <div key={p.id} onClick={() => onOpenDetail(p)} style={{ background: C.surface, borderRadius: 12, padding: "12px 14px", display: "flex", alignItems: "center", gap: 12, cursor: "pointer", border: i === 0 ? `1px solid ${C.goldDim}` : "1px solid transparent" }}>
              <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 13, color: i === 0 ? C.gold : C.textMuted, width: 20, textAlign: "center", fontWeight: 700 }}>{i + 1}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ color: C.text, fontWeight: 600, fontSize: 15 }}>{p.name}</div>
                <div style={{ color: C.textMuted, fontSize: 11.5, marginTop: 2 }}>Compo {fmt(p.tCompo, 2)} · Diff {fmt(p.tDiff, 2)} · Esec {fmt(p.punteggioEsecuzione, 2)}</div>
              </div>
              <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 19, fontWeight: 700, color: C.gold }}>{fmt(p.total, 2)}</div>
              <button onClick={(e) => { e.stopPropagation(); onDelete(p.id); }} style={{ background: "none", border: "none", color: C.textMuted, cursor: "pointer", padding: 4 }}>
                <span style={{ fontSize: 15, lineHeight: 1 }}>&#128465;</span>
              </button>
            </div>
          ))}
        </div>
      </div>
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 480, margin: "0 auto", padding: 14, background: `linear-gradient(180deg, transparent, ${C.bg} 30%)` }}>
        <Button full onClick={onNew}><span style={{ fontSize: 18, lineHeight: 1 }}>+</span> Aggiungi esibizione</Button>
      </div>
    </div>
  );
}

// ============================================================
// ADD PERFORMANCE SCREEN
// ============================================================
function AddPerformanceScreen({ specialty, onCancel, onSave }) {
  const [name, setName] = useState(null);
  const [compo, setCompo] = useState(emptyCompo());
  const [spett, setSpett] = useState(emptySpett());
  const [diff, setDiff] = useState(emptyDiff());
  const [numeroAtleti, setNumeroAtleti] = useState(16);
  const [altezzaLanci, setAltezzaLanci] = useState(0);
  const [penalty, setPenalty] = useState(emptyPenalty());
  const [portamento, setPortamento] = useState(emptyPortamento());
  const [activePart, setActivePart] = useState(0);
  const [penaltyTab, setPenaltyTab] = useState("normali");
  const [note, setNote] = useState("");

  if (name === null) return <NameModal title="Nome performance" placeholder="Es. Atleta / squadra" onConfirm={setName} onCancel={onCancel} />;

  const parts = PARTS[specialty];
  const M = COMPO_MAX[specialty];

  const punteggioCompo = computePunteggioCompo(specialty, compo, spett);
  const punteggioDiff = computePunteggioDiff(specialty, diff, numeroAtleti, altezzaLanci);
  const punteggioEsecuzione = computeEsecuzione(specialty, penalty, portamento);

  const setCompoVal = (type, idx, v) => setCompo((c) => ({ ...c, [type]: c[type].map((x, i) => (i === idx ? Math.max(0, v) : x)) }));
  const setDiffVal = (type, idx, v) => setDiff((d) => ({ ...d, [type]: d[type].map((x, i) => (i === idx ? Math.max(0, v) : x)) }));

  const showType = (type) => M[type].some((v) => v > 0);

  const normaliPenalties = [["lieve", "Lieve"], ["media", "Media"], ["alta", "Alta"]];
  const bandieraPenalties = [["lieveB", "Lieve"], ["mediaB", "Media"], ["graveB", "Grave"]];
  const activePenalties = penaltyTab === "normali" ? normaliPenalties : bandieraPenalties;

  return (
    <div style={{ paddingBottom: 100 }}>
      <TopBar title={name} subtitle="Nuova valutazione" onBack={onCancel} />
      <div style={{ padding: "16px 16px 0" }}>
        {/* ESECUZIONE */}
        <SectionTitle accent={C.teal}>Esecuzione</SectionTitle>
        <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
          {[["normali", "Penalità normali"], ["bandiera", "Penalità di bandiera"]].map(([k, label]) => (
            <button key={k} onClick={() => setPenaltyTab(k)}
              style={{ flex: 1, padding: "9px 6px", borderRadius: 8, border: "none", fontSize: 12.5, fontWeight: 700, cursor: "pointer", background: penaltyTab === k ? C.teal : C.surface, color: penaltyTab === k ? "#1C2230" : C.textMuted }}>
              {label}
            </button>
          ))}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
          {activePenalties.map(([k, label]) => (
            <Counter key={k} label={label} count={penalty[k]} accent={C.teal} onChange={(v) => setPenalty((p) => ({ ...p, [k]: Math.max(0, v) }))} />
          ))}
        </div>
        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 8 }}>Portamento (0–3)</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 20 }}>
          {[["stat", "Statico"], ["din", "Dinamico"], ["marz", "Marzialità"], ["eleg", "Eleganza"]].map(([k, label]) => (
            <Counter key={k} label={label} count={portamento[k]} accent={C.teal} min={0} onChange={(v) => setPortamento((p) => ({ ...p, [k]: Math.min(3, Math.max(0, v)) }))} />
          ))}
        </div>

        {specialty === "grande" && <NumberField label="Numero atleti" value={numeroAtleti} min={7} max={16} onChange={setNumeroAtleti} />}
        <PartTabs count={parts} active={activePart} onChange={setActivePart} />

        {/* DIFFICOLTÀ */}
        <SectionTitle accent={C.red}>Difficoltà</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
          {["D", "C", "B", "A", "AA"].map((t) => (
            <Counter key={t} label={t} count={diff[t][activePart]} accent={C.red} onChange={(v) => setDiffVal(t, activePart, v)} />
          ))}
          <Counter label="+" count={diff.piu[activePart]} accent={C.red} onChange={(v) => setDiffVal("piu", activePart, v)} />
          <Counter label="−" count={diff.meno[activePart]} accent={C.red} onChange={(v) => setDiffVal("meno", activePart, v)} />
        </div>
        <NumberField label="Altezza lanci (0–10)" value={altezzaLanci} min={0} max={10} step={0.1} onChange={setAltezzaLanci} />

        {/* COMPOSIZIONE */}
        <SectionTitle accent={C.gold}>Composizione</SectionTitle>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
          {showType("b") && (M.b[activePart] > 0) && <Counter label="B" sub={`max ${M.b[activePart]}`} count={compo.b[activePart]} accent={C.gold} onChange={(v) => setCompoVal("b", activePart, v)} />}
          {showType("c") && (M.c[activePart] > 0) && <Counter label="C" sub={`max ${M.c[activePart]}`} count={compo.c[activePart]} accent={C.gold} onChange={(v) => setCompoVal("c", activePart, v)} />}
          {specialty !== "singolo" && activePart < 4 && showType("a") && (M.a[activePart] > 0) && <Counter label="A" sub={`max ${M.a[activePart]}`} count={compo.a[activePart]} accent={C.gold} onChange={(v) => setCompoVal("a", activePart, v)} />}
          {showType("ar") && (M.ar[activePart] > 0) && <Counter label="AR" sub={`max ${M.ar[activePart]}`} count={compo.ar[activePart]} accent={C.gold} onChange={(v) => setCompoVal("ar", activePart, v)} />}
          {specialty !== "singolo" && activePart < 2 && showType("cc") && (M.cc[activePart] > 0) && <Counter label="CC" sub={`max ${M.cc[activePart]}`} count={compo.cc[activePart]} accent={C.gold} onChange={(v) => setCompoVal("cc", activePart, v)} />}
          {specialty === "singolo" && activePart === 4 && <Counter label="Stella" count={spett.stelle} accent={C.gold} onChange={(v) => setSpett((s) => ({ ...s, stelle: Math.max(0, v) }))} />}
        </div>

        <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 8 }}>Spettacolari (indipendenti dalle parti)</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
          <Counter label="Spett. coreografia" sub="max 8" count={spett.coreo} accent={C.gold} onChange={(v) => setSpett((s) => ({ ...s, coreo: Math.max(0, v) }))} />
          <Counter label="Spett. istantaneo" sub="max 10" count={spett.ist} accent={C.gold} onChange={(v) => setSpett((s) => ({ ...s, ist: Math.max(0, v) }))} />
          {specialty === "grande" && <Counter label="Spett. sincronismo" sub="max 7" count={spett.sinc} accent={C.gold} onChange={(v) => setSpett((s) => ({ ...s, sinc: Math.max(0, v) }))} />}
          <Counter label="Spett. passaggio" count={spett.diff} accent={C.gold} onChange={(v) => setSpett((s) => ({ ...s, diff: Math.max(0, v) }))} />
        </div>
        {specialty === "grande" && (
          <>
            <Toggle label="Completamento presentazione" points={7} value={spett.presCompletamento} onChange={(v) => setSpett((s) => ({ ...s, presCompletamento: v }))} />
            <Toggle label="Spettacolarità presentazione" points={3} value={spett.presSpettacolarita} onChange={(v) => setSpett((s) => ({ ...s, presSpettacolarita: v }))} />
          </>
        )}

        <div style={{ borderTop: `1px solid ${C.line}`, marginTop: 6, paddingTop: 18 }}>
          <SectionTitle accent={C.textMuted}>Altro</SectionTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
            <Counter label="Penalità grave" count={penalty.grave} accent={C.teal} onChange={(v) => setPenalty((p) => ({ ...p, grave: Math.max(0, v) }))} />
            <Counter label="Penalità speciale" count={penalty.speciale} accent={C.teal} onChange={(v) => setPenalty((p) => ({ ...p, speciale: Math.max(0, v) }))} />
          </div>
          <textarea
            value={note}
            onChange={(e) => setNote(e.target.value)}
            placeholder="Annotazioni..."
            rows={3}
            style={{ width: "100%", background: C.surface, border: `1px solid ${C.line}`, borderRadius: 10, color: C.text, fontSize: 13.5, padding: "10px 12px", outline: "none", marginBottom: 16, boxSizing: "border-box", resize: "vertical", fontFamily: "system-ui, -apple-system, sans-serif" }}
          />
        </div>

        <div style={{ background: C.surface, borderRadius: 10, padding: 12, marginBottom: 16, fontSize: 12.5, color: C.textMuted, lineHeight: 1.7 }}>
          Punteggio composizione (grezzo): <b style={{ color: C.gold }}>{fmt(punteggioCompo, 2)}</b><br />
          Punteggio difficoltà (grezzo): <b style={{ color: C.red }}>{fmt(punteggioDiff, 2)}</b><br />
          Punteggio esecuzione (trentesimi): <b style={{ color: C.teal }}>{fmt(punteggioEsecuzione, 2)}</b><br />
          <span style={{ fontSize: 11 }}>I punteggi di composizione e difficoltà verranno convertiti in trentesimi al salvataggio, in base al massimale di gara attuale.</span>
        </div>
      </div>

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, maxWidth: 480, margin: "0 auto", padding: 14, background: `linear-gradient(180deg, transparent, ${C.bg} 30%)` }}>
        <Button full onClick={() => onSave({ name, compo, spett, diff, numeroAtleti, altezzaLanci, penalty, portamento, note, punteggioCompo, punteggioDiff, punteggioEsecuzione })}>
          <span style={{ fontSize: 18, lineHeight: 1 }}>&#10003;</span> Salva esibizione
        </Button>
      </div>
    </div>
  );
}

// ============================================================
// DETAIL SCREEN
// ============================================================
function DetailScreen({ perf, specialty, group, onBack, onDelete }) {
  const garaCompoMax = groupMassimale(group.performances, group.massimaleCompoBase, "punteggioCompo");
  const garaDiffMax = groupMassimale(group.performances, group.massimaleDiffBase, "punteggioDiff");
  const { tCompo, tDiff, total } = scorePerformance(perf, specialty, group.massimaleCompoBase, group.massimaleDiffBase, garaCompoMax, garaDiffMax);

  return (
    <div>
      <TopBar title={perf.name} subtitle={`Totale: ${fmt(total, 2)} / 30`} onBack={onBack} />
      <div style={{ padding: 16 }}>
        <div style={{ background: C.surface, borderRadius: 12, padding: 14, marginBottom: 14 }}>
          <Row label="Composizione (grezzo)" value={fmt(perf.punteggioCompo, 2)} />
          <Row label="Composizione (trentesimi)" value={fmt(tCompo, 2)} accent={C.gold} />
          <Row label="Difficoltà (grezzo)" value={fmt(perf.punteggioDiff, 2)} />
          <Row label="Difficoltà (trentesimi)" value={fmt(tDiff, 2)} accent={C.red} />
          <Row label="Esecuzione (trentesimi)" value={fmt(perf.punteggioEsecuzione, 2)} accent={C.teal} />
        </div>
        {perf.note && (
          <div style={{ background: C.surface, borderRadius: 12, padding: 14, marginBottom: 14, fontSize: 13.5, color: C.text, lineHeight: 1.5 }}>
            <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 6, fontWeight: 700 }}>ANNOTAZIONI</div>
            {perf.note}
          </div>
        )}
        <Button variant="danger" full onClick={() => onDelete(perf.id)}><span style={{ fontSize: 16, lineHeight: 1 }}>&#128465;</span> Elimina esibizione</Button>
      </div>
    </div>
  );
}
function Row({ label, value, accent }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", fontSize: 13.5 }}>
      <span style={{ color: C.textMuted }}>{label}</span>
      <span style={{ fontFamily: "ui-monospace, monospace", fontWeight: 700, color: accent || C.text }}>{value}</span>
    </div>
  );
}

// ============================================================
// APP ROOT
// ============================================================
function App() {
  const [loaded, setLoaded] = useState(false);
  const [competitions, setCompetitions] = useState([]);
  const [nav, setNav] = useState({ screen: "home" });
  const [saveError, setSaveError] = useState(false);
  const [namingCompetition, setNamingCompetition] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed.competitions) setCompetitions(parsed.competitions);
        }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify({ competitions: next }));
      setSaveError(!result);
    } catch (e) {
      setSaveError(true);
    }
  }, []);

  const updateCompetitions = (next) => {
    setCompetitions(next);
    persist(next);
  };

  const currentComp = nav.compId ? competitions.find((c) => c.id === nav.compId) : null;
  const currentGroup = currentComp && nav.specialty ? currentComp.specialties[nav.specialty] : null;

  if (!loaded) {
    return (
      <div style={{ background: C.bg, minHeight: 400, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ color: C.textMuted, fontSize: 14 }}>Caricamento...</div>
      </div>
    );
  }

  return (
    <div style={{ background: C.bg, minHeight: 500, maxWidth: 480, margin: "0 auto", fontFamily: "system-ui, -apple-system, sans-serif" }}>
      {saveError && <div style={{ background: C.red, color: "#fff", fontSize: 12, textAlign: "center", padding: 6 }}>Salvataggio non riuscito. I dati potrebbero non persistere.</div>}

      {nav.screen === "home" && (
        <Home
          competitions={competitions}
          onNew={() => setNamingCompetition(true)}
          onOpen={(comp) => setNav({ screen: "competition", compId: comp.id })}
          onDelete={(id) => updateCompetitions(competitions.filter((c) => c.id !== id))}
        />
      )}

      {nav.screen === "competition" && currentComp && (
        <CompetitionScreen
          competition={currentComp}
          onBack={() => setNav({ screen: "home" })}
          onOpenSpecialty={(key) => setNav({ screen: "specialty", compId: currentComp.id, specialty: key })}
          onAddSpecialty={(key) => {
            const next = competitions.map((c) =>
              c.id === currentComp.id ? { ...c, specialties: { ...c.specialties, [key]: { massimaleCompoBase: MASSIMALE_COMPO_BASE[key], massimaleDiffBase: MASSIMALE_DIFF_BASE[key], performances: [] } } } : c
            );
            updateCompetitions(next);
          }}
        />
      )}

      {nav.screen === "specialty" && currentComp && currentGroup && (
        <SpecialtyScreen
          specialty={nav.specialty}
          group={currentGroup}
          onBack={() => setNav({ screen: "competition", compId: currentComp.id })}
          onUpdateMassimale={(field, value) => {
            const next = competitions.map((c) =>
              c.id === currentComp.id ? { ...c, specialties: { ...c.specialties, [nav.specialty]: { ...c.specialties[nav.specialty], [field]: value } } } : c
            );
            updateCompetitions(next);
          }}
          onNew={() => setNav({ ...nav, screen: "add" })}
          onOpenDetail={(perf) => setNav({ ...nav, screen: "detail", perfId: perf.id })}
          onDelete={(perfId) => {
            const next = competitions.map((c) =>
              c.id === currentComp.id
                ? { ...c, specialties: { ...c.specialties, [nav.specialty]: { ...c.specialties[nav.specialty], performances: c.specialties[nav.specialty].performances.filter((p) => p.id !== perfId) } } }
                : c
            );
            updateCompetitions(next);
          }}
        />
      )}

      {nav.screen === "add" && currentComp && currentGroup && (
        <AddPerformanceScreen
          specialty={nav.specialty}
          onCancel={() => setNav({ screen: "specialty", compId: currentComp.id, specialty: nav.specialty })}
          onSave={(data) => {
            const record = { id: `p_${Date.now()}`, date: new Date().toISOString(), ...data };
            const next = competitions.map((c) =>
              c.id === currentComp.id
                ? { ...c, specialties: { ...c.specialties, [nav.specialty]: { ...c.specialties[nav.specialty], performances: [...c.specialties[nav.specialty].performances, record] } } }
                : c
            );
            updateCompetitions(next);
            setNav({ screen: "specialty", compId: currentComp.id, specialty: nav.specialty });
          }}
        />
      )}

      {nav.screen === "detail" && currentComp && currentGroup && (
        <DetailScreen
          perf={currentGroup.performances.find((p) => p.id === nav.perfId)}
          specialty={nav.specialty}
          group={currentGroup}
          onBack={() => setNav({ screen: "specialty", compId: currentComp.id, specialty: nav.specialty })}
          onDelete={(perfId) => {
            const next = competitions.map((c) =>
              c.id === currentComp.id
                ? { ...c, specialties: { ...c.specialties, [nav.specialty]: { ...c.specialties[nav.specialty], performances: c.specialties[nav.specialty].performances.filter((p) => p.id !== perfId) } } }
                : c
            );
            updateCompetitions(next);
            setNav({ screen: "specialty", compId: currentComp.id, specialty: nav.specialty });
          }}
        />
      )}

      {namingCompetition && (
        <NameModal
          title="Nome competizione"
          placeholder="Es. Gara regionale 2026"
          onCancel={() => setNamingCompetition(false)}
          onConfirm={(name) => {
            const record = { id: `c_${Date.now()}`, name, date: new Date().toISOString(), specialties: {} };
            updateCompetitions([...competitions, record]);
            setNamingCompetition(false);
            setNav({ screen: "competition", compId: record.id });
          }}
        />
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
